[project]
name = "kecil-tts"
version = "0.3.0"
description = "Tiny Malay text-to-speech (8M-parameter ONNX), onnxruntime + numpy only"
requires-python = ">=3.9"
dependencies = ["onnxruntime>=1.16", "numpy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kecil_tts", "suaradee"]

[tool.setuptools.package-data]
kecil_tts = ["*.json", "*.onnx"]
suaradee = ["*.json", "*.onnx"]

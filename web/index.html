<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><title>Kokoro Malay 8M</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"@huggingface/transformers":"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"}}</script>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9993;--line:#2c2c2a}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px}
textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px}
button{font:inherit;padding:6px 14px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;cursor:pointer}
.m{color:var(--mut);font-size:13px}code{font-size:13px}
</style></head><body>
<h1>Kokoro Malay 8M</h1>
<p class="m">Serve the repository root (<code>python -m http.server 8000</code>) and open <code>/web/index.html</code>. The model (about 8.5 MB) runs in this tab.</p>
<textarea id="t" rows="3">Selamat pagi, boleh saya bantu encik hari ini?</textarea>
<p><button id="go" disabled>Loading model…</button> <label class="m">speed <input id="sp" type="range" min="0.7" max="1.3" step="0.05" value="1"></label></p>
<p class="m" id="info"></p><p class="m">Phonemes: <code id="ph"></code></p><audio id="au" controls></audio>
<script type="module">
import { env } from '@huggingface/transformers';
import { KokoroMalay } from './kokoro-malay.js';
const $ = (id) => document.getElementById(id);
const tts = await KokoroMalay.load({ modelDir: '/export/ms_bella_8m', g2pBase: '/web/g2p/', local: true });
$('go').textContent = 'Speak'; $('go').disabled = false;
function wav(audio, sr) {
  const b = new ArrayBuffer(44 + audio.length * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + audio.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, audio.length * 2, true);
  audio.forEach((x, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x)) * 32767, true));
  return new Blob([b], { type: 'audio/wav' });
}
$('go').onclick = async () => {
  $('go').disabled = true; const t0 = performance.now();
  $('ph').textContent = tts.phonemize($('t').value).join(' | ');
  const { audio, sampleRate } = await tts.speak($('t').value, { speed: +$('sp').value });
  const ms = performance.now() - t0, sec = audio.length / sampleRate;
  $('info').textContent = `${sec.toFixed(2)} s of audio in ${(ms / 1000).toFixed(2)} s (${(sec / (ms / 1000)).toFixed(1)}x real time)`;
  $('au').src = URL.createObjectURL(wav(audio, sampleRate)); $('au').play(); $('go').disabled = false;
};
</script></body></html>
